services:
  bot:
    build: .
    command: python bot.py
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: "8080"
      API_SECRET: ${API_SECRET:-cowbot-dev-secret}
    volumes:
      - bot-data:/data
    ports:
      - "4343:4343"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build: .
    command: python dashboard.py
    env_file: .env
    environment:
      BOT_API_URL: http://bot:8080
      API_SECRET: ${API_SECRET:-cowbot-dev-secret}
      PORT: "5000"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-cowbot-dev-secret}
    ports:
      - "5000:5000"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  bot-data:
